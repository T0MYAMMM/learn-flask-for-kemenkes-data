[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hospital-search"
version = "1.0.0"
description = "Flask search engine over a dataset of Indonesian hospitals (Rumah Sakit)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "Flask>=3.0",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
