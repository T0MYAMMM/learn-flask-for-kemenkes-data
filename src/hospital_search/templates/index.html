<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rumah Sakit Search Engine</title>
    <link
        rel="stylesheet"
        href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
        integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z"
        crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <h1 class="my-4">Rumah Sakit Search Engine</h1>
        <p class="text-muted">Searching across {{ total }} hospitals.</p>
        <form id="search-form" class="form-inline">
            <input
                type="text"
                id="search-input"
                name="query"
                placeholder="Search by name, type, address, or city..."
                class="form-control mr-2"
            />
            <button type="submit" class="btn btn-primary">Search</button>
        </form>
        <br/>
        <p id="processing-times"></p>
        <table class="table table-striped">
            <thead id="results-header">
                <tr>
                    <th>Nama</th>
                    <th>Jenis</th>
                    <th>Alamat</th>
                </tr>
            </thead>
            <tbody id="results-table">
                {% for row in results %}
                    <tr>
                        <td>{{ row['Nama Rumah Sakit'] }}</td>
                        <td>{{ row['Jenis Rumah Sakit'] }}</td>
                        <td>{{ row['Alamat'] }}</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <script>
        const form = document.getElementById("search-form");
        const input = document.getElementById("search-input");
        const tableBody = document.getElementById("results-table");
        const processingTimes = document.getElementById("processing-times");

        function escapeHtml(value) {
            const div = document.createElement("div");
            div.textContent = value == null ? "" : String(value);
            return div.innerHTML;
        }

        function renderRows(rows) {
            if (!rows.length) {
                tableBody.innerHTML =
                    '<tr><td colspan="3" class="text-center">No results found.</td></tr>';
                return;
            }
            tableBody.innerHTML = rows
                .map(function (row) {
                    return (
                        "<tr><td>" +
                        escapeHtml(row["Nama Rumah Sakit"]) +
                        "</td><td>" +
                        escapeHtml(row["Jenis Rumah Sakit"]) +
                        "</td><td>" +
                        escapeHtml(row["Alamat"]) +
                        "</td></tr>"
                    );
                })
                .join("");
        }

        form.addEventListener("submit", async function (event) {
            event.preventDefault();
            const query = input.value;
            try {
                const response = await fetch(
                    "/api/search?query=" + encodeURIComponent(query)
                );
                const data = await response.json();
                renderRows(data.results);
                processingTimes.textContent =
                    "Found " +
                    data.count +
                    " result(s) in " +
                    data.processing_time_ms +
                    " ms.";
            } catch (error) {
                processingTimes.textContent = "Search failed. Please try again.";
            }
        });
    </script>
</body>
</html>
